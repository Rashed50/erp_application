version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mydb
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend

  # phpMyAdmin (MySQL Web UI)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "8080:80"
    networks:
      - backend

  # PHP-FPM (PHP Processor)
  php:
    image: php:fpm
    container_name: php
    restart: always
    volumes:
      - ./public:/var/www/html
    networks:
      - backend

  # Nginx Web Server
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    depends_on:
      - php
    volumes:
      - ./public:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "9090:80"
    networks:
      - backend

volumes:
  mysql_data:

networks:
  backend:
    driver: bridge
