<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cost Management System</title>
    <link rel="stylesheet" href="/css/fontawesome.min.css">
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .v-field__field {
            padding: 0 !important;
            height: 38px !important;
        }

        .v-field__input {
            height: 38px !important;
            padding: 0 10px !important;
        }

        span.v-autocomplete__selection-text {
            margin-top: -7px !important;
        }

        input['type:file'],
        input['type:number'] select,
        input['type:text'] {
            height: 38px !important;
        }


        .alert {
            padding: 10px 10px;
            margin-bottom: 0px;
            font-weight: 700;
        }

        .v-card{
            padding: 20px 30px !important
        }

        .custom-bordered th,
        .custom-bordered td {
            border: 1px solid #ddd;
        }

        .search-wrapper {
            display: flex;
            gap: 15px;
        }

        .error-msg {
            color: red;
            font-size: 14px;
            margin-left: 10px;
            font-weight: 600;
            font-style: italic;
        }

        .table-image {
            width: 50px;
            height: 50px;
            margin: 10px 0px;
        }

    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
